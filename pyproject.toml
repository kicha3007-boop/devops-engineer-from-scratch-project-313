[project]
name = "url-shortener"
version = "0.1.0"
description = "Сокращатель ссылок на FastAPI: учебный DevOps-проект Хекслета"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.10",
    "python-dotenv>=1.0",
    "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
