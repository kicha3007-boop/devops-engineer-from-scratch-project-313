name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      # Тесты гоняем на настоящем Postgres: так проверяется и ограничение
      # уникальности, и нормализация postgres:// из DATABASE_URL.
      TEST_DATABASE_URL: postgres://shortener:shortener@localhost:5432/shortener_test

    steps:
      - uses: actions/checkout@v7

      - name: Установить uv (с кэшем ~/.cache/uv)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Установить зависимости
        run: uv sync --locked

      - name: Линтер
        run: make lint

      - name: Тесты
        run: make test

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Собрать образ
        run: docker build -t url-shortener:ci .

      - name: Smoke-тест образа (Caddy + uvicorn в одном контейнере)
        run: |
          docker run -d --name app -p 8090:80 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e BASE_URL=http://localhost:8090 \
            url-shortener:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/ping && break
            sleep 1
          done
          test "$(curl -fsS http://localhost:8090/ping)" = "pong"
          curl -fsS http://localhost:8090/ | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost:8090/api/links \
            -H 'Content-Type: application/json' \
            -d '{"original_url":"https://example.com","short_name":"smoke"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/r/smoke)" = "302"

      - name: Логи контейнера
        if: always()
        run: docker logs app
